<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1 class="title">Clock</h1>
    </header>
    <main>
      
     <div class="clock-container">
      <div class="clock-face-numbers-container">
        
      </div>
        <div class="clock-face">
          <div class="hand hour-hand"></div>
          <div class="hand minute-hand"></div>
          <div class="hand second-hand"></div>
        </div>
      </div>
      <div class="alarm">
        <h2>Alarm:</h2>
        <label>Hour</label>
        <input id="alarm-hour" type="number" min="0" max="23">
        <label>Minute</label>
        <input id="alarm-minute" type="number" min="0" max="59">
      </div>
      <button class="alarm-btn" id="set-alarm-btn">Set Alarm</button>
      <button class="alarm-btn" id="clear-alarm-btn">Clear All</button>
      <span class="alarm">Alarm on/off<input  type="checkbox" id="stop-alarm-toggle"checked ></span>

      <span class="alarm" >Tik Sound on/off<input type="checkbox" id="tik-toggle"/></span>
      <h2 class="alarm">Alarms:</h2>
      <div id="alarm-list">
        
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
